<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">Fayl va papka tartibi</title><desc id="desc">Bir papka ichida mavzular uchun alohida joy. Bu dastur oynasining aynan skrinshoti emas, tushuntiruvchi sxema.</desc><rect width="960" height="520" fill="#f1f5f9"/><text x="36" y="59" font-family="Arial, sans-serif" font-size="27" fill="#172554" font-weight="750">Fayl va papka tartibi</text><text x="36" y="87" font-family="Arial, sans-serif" font-size="13" fill="#64748b" font-weight="700">TUSHUNTIRUVCHI SXEMA</text><rect x="80" y="128" width="800" height="308" rx="13" fill="#f8fafc" stroke="#cbd5e1"/><path d="M144 171 L144 212" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/><rect x="115" y="149" width="610" height="49" rx="13" fill="#fff" stroke="#cbd5e1"/><text x="136" y="181" font-family="Arial, sans-serif" font-size="19" fill="#1e293b" font-weight="500">Papka: Hujjatlar</text><path d="M202 234 L202 275" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/><rect x="173" y="212" width="550" height="49" rx="13" fill="#fff" stroke="#cbd5e1"/><text x="194" y="244" font-family="Arial, sans-serif" font-size="19" fill="#1e293b" font-weight="500">Papka: Informatika</text><path d="M260 297 L260 338" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/><rect x="231" y="275" width="490" height="49" rx="13" fill="#fff" stroke="#cbd5e1"/><text x="252" y="307" font-family="Arial, sans-serif" font-size="19" fill="#1e293b" font-weight="500">Papka: Word   Excel   Taqdimot</text><path d="M318 360 L318 401" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/><rect x="289" y="338" width="430" height="49" rx="13" fill="#ede9fe" stroke="#cbd5e1"/><text x="310" y="370" font-family="Arial, sans-serif" font-size="19" fill="#1e293b" font-weight="500">Fayl: Mening_maktabim.docx</text><rect x="100" y="455" width="542" height="35" rx="16" fill="#e0f2fe" stroke="#e0f2fe"/><text x="113" y="479" font-family