<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">Brauzerda manbani tekshirish</title><desc id="desc">Manzil satri, qidiruv va ikki mustaqil manba. Bu dastur oynasining aynan skrinshoti emas, tushuntiruvchi sxema.</desc><rect width="960" height="520" fill="#f1f5f9"/><text x="36" y="59" font-family="Arial, sans-serif" font-size="27" fill="#172554" font-weight="750">Brauzerda manbani tekshirish</text><text x="36" y="87" font-family="Arial, sans-serif" font-size="13" fill="#64748b" font-weight="700">TUSHUNTIRUVCHI SXEMA</text><rect x="68" y="126" width="825" height="320" rx="13" fill="#fff" stroke="#cbd5e1"/><rect x="68" y="126" width="825" height="57" rx="12" fill="#e2e8f0" stroke="#e2e8f0"/><text x="90" y="163" font-family="Arial, sans-serif" font-size="20" fill="#64748b" font-weight="500">●  ●  ●</text><rect x="230" y="137" width="278" height="35" rx="16" fill="#fff" stroke="#fff"/><text x="243" y="161" font-family="Arial, sans-serif" font-size="15" fill="#334155" font-weight="700">Manzil satri: sayt nomi</text><rect x="104" y="208" width="754" height="66" rx="13" fill="#f8fafc" stroke="#cbd5e1"/><text x="128" y="250" font-family="Arial, sans-serif" font-size="22" fill="#1e293b" font-weight="500">Muallif + sana</text><rect x="104" y="299" width="754" height="66" rx="13" fill="#f0fdf4" stroke="#cbd5e1"/><text x="128" y="341" font-family="Arial, sans-serif" font-size="22" fill="#1e293b" font-weight="500">Ikkinchi mustaqil manba</text><rect x="140" y="457" width="487" height="35" rx="16" fill="#e0f2fe" stroke="#e0f2fe"/><text x="153" y="481" font-family="Arial, sans-serif" font-size="15" fill="#075985" font-weight="700">Qulf belgisi mazmun rostligini bildirmaydi</text></svg>