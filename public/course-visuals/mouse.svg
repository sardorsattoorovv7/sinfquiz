<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">Sichqoncha va oyna amallari</title><desc id="desc">Bosish, ikki marta bosish, menyu va sudrash. Bu dastur oynasining aynan skrinshoti emas, tushuntiruvchi sxema.</desc><rect width="960" height="520" fill="#f1f5f9"/><text x="36" y="59" font-family="Arial, sans-serif" font-size="27" fill="#172554" font-weight="750">Sichqoncha va oyna amallari</text><text x="36" y="87" font-family="Arial, sans-serif" font-size="13" fill="#64748b" font-weight="700">TUSHUNTIRUVCHI SXEMA</text><rect x="60" y="155" width="250" height="172" rx="13" fill="#f8fafc" stroke="#cbd5e1"/><text x="82" y="222" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" font-weight="700">1 bosish: tanlash</text><text x="82" y="268" font-family="Arial, sans-serif" font-size="17" fill="#64748b" font-weight="500">Kiritish</text><path d="M315 240 L354 240" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/><path d="M345 233 L354 240 L345 247" fill="none" stroke="#7c3aed" stroke-width="3"/><rect x="362" y="155" width="250" height="172" rx="13" fill="#ede9fe" stroke="#8b5cf6"/><text x="384" y="222" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" font-weight="700">2 bosish: ochish</text><text x="384" y="268" font-family="Arial, sans-serif" font-size="17" fill="#64748b" font-weight="500">Qayta ishlash</text><path d="M617 240 L656 240" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/><path d="M647 233 L656 240 L647 247" fill="none" stroke="#7c3aed" stroke-width="3"/><rect x="664" y="155" width="250" height="172" rx="13" fill="#f8fafc" stroke="#cbd5e1"/><text x="686" y="222" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" font-weight="700">O‘ng bosish: menyu</text><text x="686" y="268" font-family="Arial, sans-serif" font-size="17" fill="#64748b" font-weight="500">Natija</text><rect x="92" y="380" width="509" height="35" rx="16" fill="#e0f2fe" stroke="#e0f2fe"/><text x="105" y="404" font-family="Arial, sans-serif" font-size="15" fill="#075985" font-weight="700">Oyna sarlavhasini sudrab joyini o‘zgartiring</text></svg>