<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">Klaviatura: muhim tugmalar</title><desc id="desc">Matn kiritish va tuzatish uchun kerakli tugmalar. Bu dastur oynasining aynan skrinshoti emas, tushuntiruvchi sxema.</desc><rect width="960" height="520" fill="#f1f5f9"/><text x="36" y="59" font-family="Arial, sans-serif" font-size="27" fill="#172554" font-weight="750">Klaviatura: muhim tugmalar</text><text x="36" y="87" font-family="Arial, sans-serif" font-size="13" fill="#64748b" font-weight="700">TUSHUNTIRUVCHI SXEMA</text><rect x="65" y="125" width="830" height="307" rx="13" fill="#e2e8f0" stroke="#cbd5e1"/><rect x="91" y="150" width="243" height="94" rx="13" fill="#fff" stroke="#cbd5e1"/><text x="110" y="207" font-family="Arial, sans-serif" font-size="23" fill="#334155" font-weight="700">Shift</text><rect x="361" y="150" width="243" height="94" rx="13" fill="#fff" stroke="#cbd5e1"/><text x="380" y="207" font-family="Arial, sans-serif" font-size="23" fill="#334155" font-weight="700">Enter</text><rect x="631" y="150" width="243" height="94" rx="13" fill="#fff" stroke="#cbd5e1"/><text x="650" y="207" font-family="Arial, sans-serif" font-size="23" fill="#334155" font-weight="700">Backspace</text><rect x="91" y="275" width="243" height="94" rx="13" fill="#ddd6fe" stroke="#cbd5e1"/><text x="110" y="332" font-family="Arial, sans-serif" font-size="23" fill="#334155" font-weight="700">Ctrl + S</text><rect x="361" y="275" width="243" height="94" rx="13" fill="#fff" stroke="#cbd5e1"/><text x="380" y="332" font-family="Arial, sans-serif" font-size="23" fill="#334155" font-weight="700">Ctrl + Z</text><rect x="631" y="275" width="243" height="94" rx="13" fill="#fff" stroke="#cbd5e1"/><text x="650" y="332" font-family="Arial, sans-serif" font-size="23" fill="#334155" font-weight="700">Ctrl + C / V</text><rect x="110" y="457" width="564" height="35" rx="16" fill="#e0f2fe" stroke="#e0f2fe"/><text x="123" y="481" font-family="Arial, sans-serif" font-size="15" fill="#075985" font-weight="700">Saqlash, qaytarish va nusxa olishni sinab ko‘ring</text></svg>